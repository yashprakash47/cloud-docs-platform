spring:
  application:
    name: clouddocs-backend
  profiles:
    default: local
  datasource:
    url: ${CLOUDDOCS_DB_URL:jdbc:h2:mem:clouddocs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${CLOUDDOCS_DB_USERNAME:sa}
    password: ${CLOUDDOCS_DB_PASSWORD:}
    driver-class-name: ${CLOUDDOCS_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

clouddocs:
  storage:
    provider: ${CLOUDDOCS_STORAGE_PROVIDER:local}
    local-directory: ${CLOUDDOCS_LOCAL_STORAGE_DIRECTORY:${java.io.tmpdir}/clouddocs-files}
    max-file-size-bytes: ${CLOUDDOCS_MAX_FILE_SIZE_BYTES:10485760}
    allowed-content-types: ${CLOUDDOCS_ALLOWED_CONTENT_TYPES:text/plain,application/pdf,image/png}
    s3:
      bucket: ${CLOUDDOCS_S3_BUCKET:}
      region: ${AWS_REGION:ap-south-1}
  auth:
    mode: local
    local:
      user-header: X-User-Email
      auto-provision: true
  processing:
    message-source: ${CLOUDDOCS_PROCESSING_MESSAGE_SOURCE:local}
    sqs:
      queue-url: ${CLOUDDOCS_PROCESSING_QUEUE_URL:}
      region: ${AWS_REGION:ap-south-1}
      wait-time-seconds: ${CLOUDDOCS_SQS_WAIT_TIME_SECONDS:20}
      max-messages: ${CLOUDDOCS_SQS_MAX_MESSAGES:10}
      visibility-timeout-seconds: ${CLOUDDOCS_SQS_VISIBILITY_TIMEOUT_SECONDS:120}

logging:
  level:
    root: INFO
    com.clouddocs: INFO

info:
  app:
    name: CloudDocs
    description: Document management and processing platform
